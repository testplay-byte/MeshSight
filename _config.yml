theme: null
# The github-pages builder doesn't bundle just-the-docs, so pull it via the
# whitelisted remote-theme plugin instead of `theme:`.
remote_theme: just-the-docs/just-the-docs

plugins:
  - jekyll-remote-theme
  - jekyll-include-cache

title: MeshSight
description: Train your own object recognition — from photos to phone, fully self-hosted.
baseurl: "/MeshSight"
url: "https://testplay-byte.github.io/MeshSight"

color_scheme: dark
search_enabled: true

aux_links:
  View on GitHub:
    - https://github.com/testplay-byte/MeshSight

aux_links_new_tab: true

heading_anchors: true

footer_content: >-
  MeshSight — a general, self-trainable object recognition pipeline.
  Android app + Google Colab dataset tooling.
