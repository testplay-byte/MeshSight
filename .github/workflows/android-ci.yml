name: Android CI

# Builds the MeshSight debug APK on GitHub runners (nothing is compiled
# locally) and publishes it as a rolling GitHub Release with both the raw
# APK and a compressed ZIP asset.

on:
  push:
    paths:
      - "android/**"
      - ".github/workflows/android-ci.yml"
  pull_request:
    paths:
      - "android/**"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle cache
        uses: gradle/actions/setup-gradle@v4

      - name: Make gradlew executable
        # NTFS checkouts lose the exec bit; restore it before invoking.
        run: chmod +x android/gradlew

      - name: Assemble debug APK
        working-directory: android
        run: ./gradlew --no-daemon assembleDebug

      - name: Stage release assets
        run: |
          mkdir -p release
          cp android/app/build/outputs/apk/debug/app-debug.apk release/MeshSight-debug.apk
          cd release && zip -9 MeshSight-debug.zip MeshSight-debug.apk

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: meshsight-debug-apk
          path: release/MeshSight-debug.apk
          if-no-files-found: error

      - name: Publish rolling debug release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: MeshSight — Latest Debug Build
          prerelease: true
          body: |
            Rolling **debug build** of MeshSight, rebuilt automatically on every
            push to `main` that touches the Android app.

            **Download either file:**
            - `MeshSight-debug.apk` — install directly on your phone
            - `MeshSight-debug.zip` — the same APK, compressed (smaller to download)

            > This is a debug build: it is not signed for Play Store distribution
            > and you must allow "install from unknown sources".
          files: |
            release/MeshSight-debug.apk
            release/MeshSight-debug.zip
