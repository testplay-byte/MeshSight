name: Android CI

# Builds the MeshSight APK on GitHub's runners — no heavy compilation
# is needed on your local machine. Runs on pushes/PRs that touch the
# android/ folder, and on manual dispatch.

on:
  push:
    paths:
      - "android/**"
      - ".github/workflows/android-ci.yml"
  pull_request:
    paths:
      - "android/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Debug + Release APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle cache
        uses: gradle/actions/setup-gradle@v4

      - name: Make gradlew executable
        # NTFS checkouts lose the exec bit; restore it before invoking.
        run: chmod +x android/gradlew

      - name: Assemble debug APK
        working-directory: android
        run: ./gradlew --no-daemon assembleDebug

      - name: Assemble release APK
        working-directory: android
        # Debug signing for the unsigned release; add real signing secrets
        # (see docs/06-android-app.md) before distributing publicly.
        run: ./gradlew --no-daemon assembleRelease

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: meshsight-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: meshsight-release-apk
          path: android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
